<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <!-- Animations -->
    <style>
      .card {
        animation: float 6s ease-in-out infinite;
      }
      .card-1 { animation-delay: 0s; }
      .card-2 { animation-delay: 1.5s; }
      .card-3 { animation-delay: 3s; }
      .card-4 { animation-delay: 4.5s; }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .accent-line {
        animation: pulseWidth 4s ease-in-out infinite;
      }
      @keyframes pulseWidth {
        0%, 100% { width: 40px; }
        50% { width: 100px; }
      }

      .icon-rotate {
        transform-origin: center;
        animation: rotate 8s linear infinite;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .icon-pulse {
        transform-origin: center;
        animation: scalePulse 6s ease-in-out infinite;
      }
      @keyframes scalePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
    </style>
    
    <!-- Filters for shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0D1117" />

  <!-- Container for cards. X: 35, 245, 455, 665 -->
  <!-- Width: 200, Height: 120 -->

  <!-- Card 1: Currently Building -->
  <g class="card card-1" style="transform-origin: 135px 140px;">
    <rect x="35" y="80" width="200" height="120" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="36" y="81" width="40" height="4" rx="2" fill="#4F8CFF" class="accent-line" />
    
    <g transform="translate(60, 115)" class="icon-rotate">
      <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#8B949E" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#161B22" stroke="#8B949E" stroke-width="2"/>
    </g>
    
    <text x="90" y="120" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">CURRENTLY BUILDING</text>
    <text x="35" y="160" width="200" text-anchor="middle" transform="translate(100, 0)" fill="#E6EDF3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">RedisLite</text>
  </g>

  <!-- Card 2: Learning -->
  <g class="card card-2" style="transform-origin: 345px 140px;">
    <rect x="245" y="80" width="200" height="120" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="246" y="81" width="40" height="4" rx="2" fill="#28C840" class="accent-line" />
    
    <g transform="translate(270, 115)" class="icon-pulse">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="none" stroke="#8B949E" stroke-width="2"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#8B949E" stroke-width="2"/>
    </g>
    
    <text x="300" y="120" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">LEARNING</text>
    <text x="245" y="160" width="200" text-anchor="middle" transform="translate(100, 0)" fill="#E6EDF3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Distributed Consensus</text>
  </g>

  <!-- Card 3: Reading -->
  <g class="card card-3" style="transform-origin: 555px 140px;">
    <rect x="455" y="80" width="200" height="120" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="456" y="81" width="40" height="4" rx="2" fill="#FEBC2E" class="accent-line" />
    
    <g transform="translate(480, 115)" class="icon-pulse">
      <path d="M-8,-10 h16 v20 h-16 z M-4,-4 h8 M-4,0 h8 M-4,4 h5" fill="none" stroke="#8B949E" stroke-width="2"/>
    </g>
    
    <text x="510" y="120" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">READING</text>
    <text x="455" y="150" width="200" text-anchor="middle" transform="translate(100, 0)" fill="#E6EDF3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">DDIA</text>
    <text x="455" y="170" width="200" text-anchor="middle" transform="translate(100, 0)" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">Designing Data-Intensive Apps</text>
  </g>

  <!-- Card 4: Latest Project -->
  <g class="card card-4" style="transform-origin: 765px 140px;">
    <rect x="665" y="80" width="200" height="120" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)"/>
    <rect x="666" y="81" width="40" height="4" rx="2" fill="#A371F7" class="accent-line" />
    
    <g transform="translate(690, 115)" class="icon-rotate">
      <path d="M-8,8 L8,-8 M8,-8 L4,8 M8,-8 L-8,4" fill="none" stroke="#8B949E" stroke-width="2"/>
    </g>
    
    <text x="720" y="120" fill="#8B949E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">LATEST PROJECT</text>
    <text x="665" y="160" width="200" text-anchor="middle" transform="translate(100, 0)" fill="#E6EDF3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Aura</text>
  </g>

</svg>
