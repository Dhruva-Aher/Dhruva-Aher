<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <!-- Background Orb Animations -->
    <style>
      @keyframes float1 { 
        0% { transform: translate(0px, 0px) scale(1); } 
        33% { transform: translate(50px, -30px) scale(1.15); } 
        66% { transform: translate(-30px, 20px) scale(0.9); } 
        100% { transform: translate(0px, 0px) scale(1); } 
      }
      @keyframes float2 { 
        0% { transform: translate(0px, 0px) scale(1); } 
        33% { transform: translate(-60px, 40px) scale(0.9); } 
        66% { transform: translate(40px, -20px) scale(1.1); } 
        100% { transform: translate(0px, 0px) scale(1); } 
      }
      @keyframes float3 { 
        0% { transform: translate(0px, 0px) scale(1); } 
        33% { transform: translate(40px, 40px) scale(1.05); } 
        66% { transform: translate(-50px, -30px) scale(0.95); } 
        100% { transform: translate(0px, 0px) scale(1); } 
      }

      /* Grid Pulse */
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.22; }
      }

      /* Terminal Float Animation */
      @keyframes termFloat { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-6px); } 
      }

      /* Staggered Text Fade Up */
      @keyframes fadeUp { 
        0% { opacity: 0; transform: translateY(10px); } 
        100% { opacity: 1; transform: translateY(0); } 
      }

      /* Blinking Cursor */
      @keyframes blink { 
        0%, 100% { opacity: 1; } 
        50% { opacity: 0; } 
      }

      /* Glow line sweep */
      @keyframes lineSweep {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }

      .orb1 { animation: float1 16s ease-in-out infinite; }
      .orb2 { animation: float2 20s ease-in-out infinite; }
      .orb3 { animation: float3 24s ease-in-out infinite; }
      .grid-layer { animation: pulseGrid 8s ease-in-out infinite; }
      .terminal { animation: termFloat 6s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      
      .text-line { 
        opacity: 0; 
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
      }
      
      .d1 { animation-delay: 0.3s; }
      .d2 { animation-delay: 0.6s; }
      .d3 { animation-delay: 0.9s; }
      .d4 { animation-delay: 1.2s; }
      .d5 { animation-delay: 1.5s; }
      .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; }
      .d8 { animation-delay: 2.4s; }
    </style>
    
    <!-- Blur for background orbs -->
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    
    <!-- Premium drop shadow for terminal -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4F8CFF" flood-opacity="0.15"/>
    </filter>

    <!-- Glass Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0.5" />
    </linearGradient>
    
    <!-- Orb gradients -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0" />
    </radialGradient>
    
    <!-- Dot grid pattern -->
    <pattern id="dot-grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B949E" class="grid-layer" />
    </pattern>
  </defs>

  <!-- 1. Background Base -->
  <rect width="100%" height="100%" fill="#0D1117" />
  
  <!-- Floating Orbs Layer -->
  <g filter="url(#blur-heavy)">
    <circle cx="220" cy="110" r="200" fill="url(#orb-blue)" class="orb1" />
    <circle cx="780" cy="370" r="220" fill="url(#orb-purple)" class="orb2" />
    <circle cx="520" cy="240" r="180" fill="url(#orb-blue)" class="orb3" />
  </g>

  <!-- Animated Dot Grid Layer -->
  <rect width="100%" height="100%" fill="url(#dot-grid)" />

  <!-- Horizontal Glow Accents -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.4" />
  <line x1="0" y1="479" x2="900" y2="479" stroke="url(#border-grad)" stroke-width="1.5" opacity="0.4" />

  <!-- 2. Glass Terminal Window -->
  <g transform="translate(130, 80)">
    <g class="terminal">
      
      <!-- Terminal Base / Glass Panel -->
      <rect width="640" height="320" rx="14" fill="#161B22" fill-opacity="0.88" stroke="url(#border-grad)" stroke-width="1.5" filter="url(#drop-shadow)" />
      
      <!-- Terminal Header Chrome -->
      <path d="M0 14 C0 6.268 6.268 0 14 0 L626 0 C633.732 0 640 6.268 640 14 L640 40 L0 40 Z" fill="#0D1117" fill-opacity="0.75" />
      <line x1="0" y1="40" x2="640" y2="40" stroke="#30363D" stroke-width="1" />
      
      <!-- Window Controls -->
      <g transform="translate(22, 20)">
        <circle cx="0" cy="0" r="6" fill="#FF5F57" />
        <circle cx="20" cy="0" r="6" fill="#FEBC2E" />
        <circle cx="40" cy="0" r="6" fill="#28C840" />
      </g>

      <!-- Terminal Title -->
      <text x="320" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8B949E" text-anchor="middle" letter-spacing="0.8">dhruva@dev ~ %</text>

      <!-- Active Tab Indicator -->
      <rect x="540" y="10" width="80" height="20" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="580" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#4F8CFF" text-anchor="middle">zsh</text>

      <!-- Terminal Content -->
      <g font-size="14.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" fill="#8B949E">
        
        <!-- Line 1: whoami command -->
        <g transform="translate(35, 78)">
          <g class="text-line d1">
            <text fill="#4F8CFF" font-weight="bold">$</text>
            <text x="20" fill="#E6EDF3">whoami</text>
          </g>
        </g>

        <!-- Line 2: Name -->
        <g transform="translate(35, 118)">
          <g class="text-line d2">
            <text fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="0.5">Dhruva Aher</text>
          </g>
        </g>

        <!-- Line 3: University -->
        <g transform="translate(35, 148)">
          <g class="text-line d3">
            <text fill="#4F8CFF" font-size="13">Computer Science @ Arizona State University (2025–2028)</text>
          </g>
        </g>

        <!-- Line 4: Description Pt 1 -->
        <g transform="translate(35, 182)">
          <g class="text-line d4">
            <text fill="#8B949E">Building high-performance distributed systems, backend infrastructure,</text>
          </g>
        </g>
        
        <!-- Line 5: Description Pt 2 -->
        <g transform="translate(35, 204)">
          <g class="text-line d5">
            <text fill="#8B949E">and applied AI applications.</text>
          </g>
        </g>

        <!-- Line 6: Currently Building -->
        <g transform="translate(35, 242)">
          <g class="text-line d6">
            <text fill="#4F8CFF" font-weight="bold">→</text>
            <text x="24" fill="#E6EDF3">Currently Building</text>
            <text x="220" fill="#4F8CFF" font-weight="600">RedisLite · Aura · JusticeQueue</text>
          </g>
        </g>

        <!-- Line 7: Looking For -->
        <g transform="translate(35, 268)">
          <g class="text-line d7">
            <text fill="#28C840" font-weight="bold">→</text>
            <text x="24" fill="#E6EDF3">Looking For</text>
            <text x="220" fill="#28C840" font-weight="600">Summer 2027 SWE Internship</text>
          </g>
        </g>
        
        <!-- Line 8: Empty prompt & cursor -->
        <g transform="translate(35, 296)">
          <g class="text-line d8">
            <text fill="#4F8CFF" font-weight="bold">$</text>
            <rect x="20" y="-12" width="8" height="15" rx="1" fill="#4F8CFF" class="cursor" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
