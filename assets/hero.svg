<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <style>
      /* Background Orb Animations */
      @keyframes float1 { 
        0% { transform: translate(0px, 0px); } 
        33% { transform: translate(40px, -40px) scale(1.1); } 
        66% { transform: translate(-20px, 20px) scale(0.9); } 
        100% { transform: translate(0px, 0px); } 
      }
      @keyframes float2 { 
        0% { transform: translate(0px, 0px); } 
        33% { transform: translate(-50px, 30px) scale(0.95); } 
        66% { transform: translate(30px, -30px) scale(1.05); } 
        100% { transform: translate(0px, 0px); } 
      }
      @keyframes float3 { 
        0% { transform: translate(0px, 0px); } 
        33% { transform: translate(30px, 50px) scale(1.05); } 
        66% { transform: translate(-40px, -20px) scale(0.95); } 
        100% { transform: translate(0px, 0px); } 
      }

      /* Grid Pulse */
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1.2; }
      }

      /* Terminal Float Animation */
      @keyframes termFloat { 
        0%, 100% { transform: translateY(0); } 
        50% { transform: translateY(-4px); } 
      }

      /* Staggered Text Fade Up */
      @keyframes fadeUp { 
        0% { opacity: 0; transform: translateY(8px); } 
        100% { opacity: 1; transform: translateY(0); } 
      }

      /* Blinking Cursor */
      @keyframes blink { 
        0%, 100% { opacity: 1; } 
        50% { opacity: 0; } 
      }
      
      /* Applied Classes */
      .orb1 { animation: float1 18s ease-in-out infinite; }
      .orb2 { animation: float2 22s ease-in-out infinite; }
      .orb3 { animation: float3 25s ease-in-out infinite; }
      .grid-layer { animation: pulseGrid 12s ease-in-out infinite; }
      .terminal { animation: termFloat 6s ease-in-out infinite; }
      .cursor { animation: blink 1.2s step-end infinite; }
      
      .text-line { 
        opacity: 0; 
        animation: fadeUp 0.6s ease-out forwards; 
      }
      
      /* Animation Delays for Text */
      .d1 { animation-delay: 0.4s; }
      .d2 { animation-delay: 0.7s; }
      .d3 { animation-delay: 1.0s; }
      .d4 { animation-delay: 1.3s; }
      .d5 { animation-delay: 1.6s; }
      .d6 { animation-delay: 1.9s; }
      .d7 { animation-delay: 2.2s; }
      .d8 { animation-delay: 2.5s; }
    </style>
    
    <!-- Blur for background orbs -->
    <filter id="blur-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
    
    <!-- Premium drop shadow for the terminal -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Orb gradient definition -->
    <radialGradient id="orb-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0" />
    </radialGradient>
    
    <!-- Dot grid pattern -->
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E6EDF3" opacity="0.08" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="100%" height="100%" fill="#0D1117" />
  
  <!-- Floating Orbs Layer -->
  <g filter="url(#blur-filter)">
    <circle cx="250" cy="120" r="180" fill="url(#orb-grad)" class="orb1" />
    <circle cx="750" cy="380" r="200" fill="url(#orb-grad)" class="orb2" />
    <circle cx="550" cy="240" r="220" fill="url(#orb-grad)" class="orb3" />
  </g>

  <!-- Animated Dot Grid Layer -->
  <rect width="100%" height="100%" fill="url(#dot-grid)" class="grid-layer" />

  <!-- 2. & 3. Glass Terminal Window Wrapper -->
  <g transform="translate(140, 90)">
    <!-- Terminal Animation Container -->
    <g class="terminal">
      
      <!-- Terminal Base / Glass Panel -->
      <rect width="620" height="310" rx="12" fill="#161B22" fill-opacity="0.85" stroke="#30363D" stroke-width="1.5" filter="url(#drop-shadow)" />
      
      <!-- Terminal Header / Chrome -->
      <path d="M0 12 C0 5.373 5.373 0 12 0 L608 0 C614.627 0 620 5.373 620 12 L620 38 L0 38 Z" fill="#0D1117" fill-opacity="0.6" />
      <line x1="0" y1="38" x2="620" y2="38" stroke="#30363D" stroke-width="1.5" />
      
      <!-- Window Controls -->
      <g transform="translate(20, 19)">
        <circle cx="0" cy="0" r="6.5" fill="#FF5F57" />
        <circle cx="22" cy="0" r="6.5" fill="#FEBC2E" />
        <circle cx="44" cy="0" r="6.5" fill="#28C840" />
      </g>

      <!-- Terminal Title -->
      <text x="310" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8B949E" text-anchor="middle" letter-spacing="0.5">dhruva@dev ~ %</text>

      <!-- 4. Terminal Content -->
      <g font-size="14.5" font-family="'Courier New', Consolas, Monaco, monospace" fill="#8B949E">
        
        <!-- Line 1: whoami command -->
        <g transform="translate(32, 74)">
          <g class="text-line d1">
            <text fill="#4F8CFF" font-weight="bold">$</text>
            <text x="20" fill="#E6EDF3">whoami</text>
          </g>
        </g>

        <!-- Line 2: Name -->
        <g transform="translate(32, 114)">
          <g class="text-line d2">
            <text fill="#FFFFFF" font-size="26" font-weight="bold" letter-spacing="0.5">Dhruva Aher</text>
          </g>
        </g>

        <!-- Line 3: University -->
        <g transform="translate(32, 144)">
          <g class="text-line d3">
            <text>Computer Science @ Arizona State University (2025–2028)</text>
          </g>
        </g>

        <!-- Line 4: Description Pt 1 -->
        <g transform="translate(32, 178)">
          <g class="text-line d4">
            <text>Building distributed systems, backend infrastructure,</text>
          </g>
        </g>
        
        <!-- Line 5: Description Pt 2 -->
        <g transform="translate(32, 200)">
          <g class="text-line d5">
            <text>and AI applications.</text>
          </g>
        </g>

        <!-- Line 6: Currently Building -->
        <g transform="translate(32, 238)">
          <g class="text-line d6">
            <text fill="#4F8CFF" font-weight="bold">→</text>
            <text x="24" fill="#E6EDF3">Currently Building</text>
            <text x="220" fill="#4F8CFF">RedisLite · Aura</text>
          </g>
        </g>

        <!-- Line 7: Looking For -->
        <g transform="translate(32, 264)">
          <g class="text-line d7">
            <text fill="#4F8CFF" font-weight="bold">→</text>
            <text x="24" fill="#E6EDF3">Looking For</text>
            <text x="220" fill="#4F8CFF">Summer 2027 SWE Internship</text>
          </g>
        </g>
        
        <!-- Line 8: Empty prompt & cursor -->
        <g transform="translate(32, 292)">
          <g class="text-line d8">
            <text fill="#4F8CFF" font-weight="bold">$</text>
            <rect x="20" y="-12" width="8" height="15" fill="#4F8CFF" class="cursor" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
