<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- Multi-color Gradient for Neon Laptop -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="40%" stop-color="#4F8CFF" />
      <stop offset="80%" stop-color="#A371F7" />
      <stop offset="100%" stop-color="#FF5F57" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#4F8CFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <style>
      .laptop-glow {
        animation: neonPulse 4s ease-in-out infinite;
      }
      @keyframes neonPulse {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 10px rgba(79, 140, 255, 0.7)); }
        50% { opacity: 1; filter: drop-shadow(0 0 22px rgba(163, 113, 247, 0.95)); }
      }
      .code-bracket {
        animation: floatBracket 3s ease-in-out infinite;
      }
      @keyframes floatBracket {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="240" rx="16" fill="#161B22" stroke="url(#card-border)" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Accent Top Line -->
  <rect x="30" y="0" width="120" height="3" rx="1.5" fill="url(#neon-grad)" />

  <!-- LEFT CONTENT AREA -->
  <g transform="translate(40, 35)">
    <!-- Section Header -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" y="20">About Me</text>
    
    <!-- Subtitle / Bio -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4F8CFF" font-weight="600" y="48">
      Computer Science @ Arizona State University (2025–2028)
    </text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#8B949E" y="74">
      I build high-performance distributed systems, backend infrastructure, and applied AI applications.
    </text>
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#8B949E" y="96">
      Passionate about low-latency key-value stores, task orchestration, and LLM pipelines.
    </text>

    <!-- Pill Badges Section -->
    <g transform="translate(0, 125)">
      <!-- Pill 1: Currently Building -->
      <g>
        <rect width="360" height="32" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#4F8CFF" />
        <text font-family="sans-serif" font-size="12" font-weight="700" fill="#E6EDF3" x="28" y="20">Building:</text>
        <text font-family="sans-serif" font-size="12" font-weight="600" fill="#4F8CFF" x="90" y="20">RedisLite · Aura · JusticeQueue</text>
      </g>

      <!-- Pill 2: Looking For -->
      <g transform="translate(0, 42)">
        <rect width="380" height="32" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#28C840" />
        <text font-family="sans-serif" font-size="12" font-weight="700" fill="#E6EDF3" x="28" y="20">Looking For:</text>
        <text font-family="sans-serif" font-size="12" font-weight="600" fill="#28C840" x="115" y="20">Summer 2027 SWE Internship</text>
      </g>
    </g>
  </g>

  <!-- RIGHT NEON LAPTOP GRAPHIC -->
  <g transform="translate(705, 45)" class="laptop-glow">
    <!-- Laptop Screen Outer Frame -->
    <rect x="0" y="0" width="140" height="98" rx="10" fill="none" stroke="url(#neon-grad)" stroke-width="3" filter="url(#neon-glow)" />
    
    <!-- Laptop Screen Inner Frame -->
    <rect x="6" y="6" width="128" height="86" rx="6" fill="#0D1117" opacity="0.9" />

    <!-- Terminal Lines Background inside Screen -->
    <line x1="14" y1="20" x2="60" y2="20" stroke="#30363D" stroke-width="2" />
    <line x1="14" y1="28" x2="40" y2="28" stroke="#30363D" stroke-width="2" />

    <!-- Code Symbol inside Screen </ > -->
    <g transform="translate(35, 30)" class="code-bracket">
      <!-- Left Angle Bracket < -->
      <path d="M12,8 L2,18 L12,28" fill="none" stroke="url(#neon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Slash / -->
      <path d="M24,32 L34,4" fill="none" stroke="url(#neon-grad)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Right Angle Bracket > -->
      <path d="M46,8 L56,18 L46,28" fill="none" stroke="url(#neon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Laptop Base / Keyboard Hinge -->
    <path d="M-22,104 L162,104 C165,104 167,106 166,109 L157,121 C156,123 153,125 149,125 L-9,125 C-13,125 -16,123 -17,121 L-26,109 C-27,106 -25,104 -22,104 Z" 
          fill="none" stroke="url(#neon-grad)" stroke-width="3" filter="url(#neon-glow)" />
    
    <!-- Laptop Trackpad Notch -->
    <rect x="52" y="105" width="36" height="5" rx="2.5" fill="url(#neon-grad)" />
  </g>
</svg>
